name: 'Update schedule'

# ⚠️NOTICE: Do NOT add `on: schedule` cron triggers in forked repositories.
# Forks may multiply scheduled runs and GitHub Actions resource usage is near limits.
# Many scheduled workflows from forks can cause workflows to be disabled.
# If scheduled execution is required, use other deployment methods.

on:
  schedule:
    # 每天北京时间凌晨 04:35 自动运行一次 (UTC 20:35)
    - cron: '35 20 * * *'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 明确赋予写权限，避免 git push 出现 403 错误
    steps:
      - name: Set branch name
        id: vars
        # 如果不是 Guovin 的仓库，则默认使用 main 分支
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'main' }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Run with setup-python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          update-environment: true
          cache: 'pipenv'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install pipenv
        run: pip3 install --user pipenv

      - name: Install dependecies
        run: pipenv --python 3.14 && pipenv install --deploy

      - name: Update
        run: pipenv run dev

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi
